<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="420" height="140" viewBox="0 0 420 140" role="img" aria-labelledby="title desc" style="overflow:visible">
  <title id="title">ARISE AI</title>
  <desc id="desc">ARISE AI logo — animated geometric A mark with gradient and friendly wordmark</desc>

  <defs>
    <linearGradient id="g-gradient" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="60%" stop-color="#4c2bdc"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#0b1220" flood-opacity="0.12"/>
    </filter>

    <style>
      .markGroup { transform-origin: 48px 48px; animation: float 4s ease-in-out infinite; }
      @keyframes float {
        0% { transform: translateY(0) rotate(0deg) scale(1); }
        50% { transform: translateY(-6px) rotate(-1.2deg) scale(1.006); }
        100% { transform: translateY(0) rotate(0deg) scale(1); }
      }
      .word { font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; font-weight:700; letter-spacing:-0.6px; }
      .sub { font-family: Inter, system-ui; font-weight:600; fill:#94a3b8; font-size:14px; }
    </style>
  </defs>

  <g transform="translate(12,12)">
    <rect width="96" height="96" rx="20" ry="20" fill="url(#g-gradient)" filter="url(#softShadow)"/>
    <path d="M36 28 L44 28 L24 84 L16 84 Z" fill="#ffffff" opacity="0.98" transform="translate(8,0)" />
    <path d="M56 28 L64 28 L44 84 L36 84 Z" fill="#ffffff" opacity="0.98" transform="translate(8,0)" />
    <rect x="36" y="50" width="24" height="8" fill="rgba(255,255,255,0.06)" transform="translate(8,0)" rx="2" ry="2"/>
    <circle cx="78" cy="20" r="5.5" fill="#ffffff" opacity="0.98" transform="translate(0,0)"/>
    <g class="markGroup" style="transform-box: fill-box">
      <path d="M10 16c18-12 68-12 86 0v60c-18 12-68 12-86 0z" fill="white" opacity="0.035"/>
    </g>
  </g>

  <g transform="translate(130,86)">
    <text x="0" y="0" class="word" font-size="40" fill="url(#g-gradient)">ARISE</text>
    <text x="212" y="-6" class="sub">AI</text>
  </g>
</svg>
